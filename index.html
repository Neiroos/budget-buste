.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:10px 14px;font-size:14px;white-space:nowrap}
.chip b{font-weight:600}
.chip.add{color:var(--accent);border-style:dashed}
.perday{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
.tag.warn{color:var(--warn);background:var(--warn-bg)}
.tr{display:flex;flex-direction:column;gap:10px}
.tr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tr-h .t{min-width:0}
.tr-h .t b{display:block;font-weight:600}
.tr-h .t small{display:block}
.tr-h>b{font-size:18px;font-weight:700;white-space:nowrap}
.tr .done{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;font-size:14px;padding:9px 2px}
.ver{display:flex;flex-direction:column;gap:10px}
.vres{display:flex;align-items:center;gap:6px;font-weight:600;margin-top:10px}
.vres.ok{color:var(--ok)}.vres.warn{color:var(--warn)}.vres.bad{color:var(--bad)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{background:var(--pb);border:1px solid var(--pl);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.skin.on{border-color:var(--pa);box-shadow:0 0 0 1px var(--pa)}
.skin .pv{display:block;position:relative;overflow:hidden;height:56px;border-radius:10px;border:1px solid rgba(var(--prgb),.36);background:linear-gradient(160deg,rgba(var(--prgb),.26),rgba(var(--prgb),.06) 72%),var(--ps)}
.skin .pv::before{content:"";position:absolute;inset:0;background:var(--part);-webkit-mask-image:var(--pmask);mask-image:var(--pmask)}
.skin .pv .wm{position:absolute;right:-4px;bottom:-12px;color:var(--pa);opacity:.3}
.skin b{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:0 2px 2px}
.toast .lnk{padding:0;margin-left:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

<script>
(function(){
'use strict';
/*CALC_START*/
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const COLORS=['#5b9bd5','#d98a56','#62b08a','#4fb3b0','#9b7fd1','#c26aa5','#8fa3b3','#d6c26a'];
const DEFAULT_CATS=[
  {name:'Affitto/Mutuo',icon:'home',color:'#5b9bd5',group:'need',daily:false},
  {name:'Bollette',icon:'bolt',color:'#d98a56',group:'need',daily:false},
  {name:'Spesa alimentare',icon:'cart',color:'#62b08a',group:'need',daily:true},
  {name:'Trasporti/Carburante',icon:'car',color:'#4fb3b0',group:'need',daily:true},
  {name:'Svago',icon:'smile',color:'#9b7fd1',group:'want',daily:true},
  {name:'Extra',icon:'star',color:'#c26aa5',group:'want',daily:true},
  {name:'Abbonamenti',icon:'repeat',color:'#8fa3b3',group:'want',daily:false},
  {name:'Risparmio',icon:'shield',color:'#d6c26a',group:'save',daily:false}
];
const GROUPS=[
  {id:'need',name:'Necessit\u00e0',color:'#5b9bd5',target:50},
  {id:'want',name:'Desideri',color:'#9b7fd1',target:30},
  {id:'save',name:'Risparmio',color:'#62b08a',target:20}
];
function guessGroup(name){
  const n=String(name||'').toLowerCase();
  if(/rispar|invest|accantonament|fondo/.test(n)) return 'save';
  if(/svago|extra|abbonament|ristorant|vacanz|hobby|shopping|regal|palestra|bar\b/.test(n)) return 'want';
  return 'need';
}
function guessDaily(name){
  return !/affitto|mutuo|bollett|abbonament|rispar|assicur|\brat[ae]\b|prestit|condomin|invest|tass|finanziament/.test(String(name||'').toLowerCase());
}
function pad2(n){return String(n).padStart(2,'0');}
function fmt(c){
  c=Math.round(c); const neg=c<0; c=Math.abs(c);
  const e=Math.floor(c/100), d=c%100;
  const s=String(e).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad2(d);
  return (neg?'−':'')+s+' €';
}
function parseMoney(s){
  s=String(s==null?'':s).replace(/[€\s ]/g,'');
  if(!s) return 0;
  if(/[^0-9.,\-]/.test(s)) return null;
  let neg=false; if(s[0]==='-'){neg=true; s=s.slice(1);}
  if((s.match(/,/g)||[]).length>1) return null;
  if(s.indexOf(',')>=0){ s=s.replace(/\./g,'').replace(',','.'); }
  else if((s.match(/\./g)||[]).length>1){ s=s.replace(/\./g,''); }
  else if(/\.\d{3}$/.test(s)){ s=s.replace('.',''); }
  const n=parseFloat(s); if(!isFinite(n)) return null;
  const c=Math.round(n*100); return neg?-c:c;
}
function centsToStr(c){ c=Math.round(c); if(!c) return ''; return Math.floor(c/100)+(c%100?','+pad2(c%100):''); }
function monthKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function shiftMonth(key,n){let p=key.split('-').map(Number),y=p[0],m=p[1]+n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad2(m);}
function daysIn(key){const p=key.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function clampDate(key,day){return key+'-'+pad2(Math.min(Math.max(1,day),daysIn(key)));}
function isClosed(s,key){return !!(s.closed&&s.closed[key]);}
function monthView(s,key){
  const m=s.months[key];
  if(m) return {salary:m.salary||0,extra:m.extra||0,budgets:m.budgets||{},carry:m.carry||{},got:!!m.got,pre:!!m.pre,incAcc:m.incAcc||''};
  const keys=Object.keys(s.months).sort(); let src=null;
  for(const k of keys){ if(k<key) src=k; }
  if(!src && keys.length) src=keys[0];
  if(src){ const b=s.months[src]; return {salary:b.salary||0, extra:0, budgets:Object.assign({},b.budgets), carry:{}, got:false, pre:false, incAcc:''}; }
  return {salary:0, extra:0, budgets:{}, carry:{}, got:false, pre:false, incAcc:''};
}
function monthEnsure(s,key){
  if(!s.months[key]){const v=monthView(s,key);s.months[key]={salary:v.salary,extra:v.extra,budgets:Object.assign({},v.budgets),carry:{},got:false,pre:false,incAcc:''};}
  if(!s.months[key].carry) s.months[key].carry={};
  return s.months[key];
}
function goalBalances(s){
  const b={}; (s.goals||[]).forEach(g=>{b[g.id]=0;});
  (s.deposits||[]).forEach(d=>{ if(d.goalId in b) b[d.goalId]+=d.amount; });
  return b;
}
function compute(s,key){
  const m=monthView(s,key);
  const income=(m.salary||0)+(m.extra||0);
  const spentBy={}; let totSpent=0;
  for(const e of s.expenses){
    if(e.date.slice(0,7)===key){ spentBy[e.catId]=(spentBy[e.catId]||0)+e.amount; totSpent+=e.amount; }
  }
  const cats=s.categories.map(c=>{
    const budget=(m.budgets&&m.budgets[c.id])||0, carry=(m.carry&&m.carry[c.id])||0, spent=spentBy[c.id]||0, avail=budget+carry;
    return {cat:c,budget:budget,carry:carry,avail:avail,spent:spent,left:avail-spent,pct:avail>0?spent/avail:(spent>0?Infinity:0)};
  });
  const known=new Set(s.categories.map(c=>c.id)); let orphan=0;
  for(const id in spentBy){ if(!known.has(id)) orphan+=spentBy[id]; }
  const sumOf=(list,f)=>list.reduce((a,x)=>a+f(x),0);
  const totBudget=sumOf(cats,x=>x.budget), carryTot=sumOf(cats,x=>x.carry);
  const grp={need:0,want:0,save:0}; cats.forEach(x=>{grp[(x.cat.group in grp)?x.cat.group:'need']+=x.budget;});
  const gb=goalBalances(s);
  const accounts=s.accounts.map(a=>{
    const list=cats.filter(x=>x.cat.accountId===a.id);
    const versare=sumOf(list,x=>x.budget), carry=sumOf(list,x=>x.carry), speso=sumOf(list,x=>x.spent);
    const risparmi=sumOf((s.goals||[]).filter(g=>g.accountId===a.id),g=>gb[g.id]||0);
    return {acc:a,list:list,versare:versare,carry:carry,speso:speso,rimane:versare+carry-speso,risparmi:risparmi};
  });
  const accIds=new Set(s.accounts.map(a=>a.id));
  const loose=cats.filter(x=>!accIds.has(x.cat.accountId));
  const lv=sumOf(loose,x=>x.budget), lc=sumOf(loose,x=>x.carry), ls=sumOf(loose,x=>x.spent)+orphan;
  const senza={list:loose,versare:lv,carry:lc,speso:ls,rimane:lv+lc-ls,orphan:orphan};
  const unassigned=income-totBudget;
  const disponibile=income+carryTot-totSpent;
  const rimaneSum=sumOf(accounts,x=>x.rimane)+senza.rimane;
  return {m:m,income:income,totBudget:totBudget,carryTot:carryTot,groups:grp,totSpent:totSpent,unassigned:unassigned,residuoBuste:totBudget+carryTot-totSpent,
    disponibile:disponibile,cats:cats,accounts:accounts,senza:senza,rimaneSum:rimaneSum,check:(rimaneSum+unassigned===disponibile)};
}
/* Chiusura mese: prima si controlla tutto, poi si scrive. Se qualcosa non va, non cambia nulla. */
function applyClose(s,key,choices,todayKey,ts,uidFn){
  if(isClosed(s,key)) throw new Error('Questo mese è già chiuso.');
  if(key>todayKey) throw new Error('Non puoi chiudere un mese futuro.');
  const next=shiftMonth(key,1);
  if(isClosed(s,next)) throw new Error('Il mese successivo è già chiuso.');
  const c=compute(s,key); const rows=[];
  if(!c.m.got&&c.income>0) throw new Error('Segna prima le entrate di questo mese come arrivate (Home, riquadro Stipendio).');
  for(const x of c.cats){
    const left=x.left; const ch=(choices&&choices[x.cat.id])||{rule:'reset'};
    const rule=left===0?'none':ch.rule; let goalId='';
    if(left!==0&&rule!=='reset'&&rule!=='carry'&&rule!=='save') throw new Error('Scelta non valida per '+x.cat.name+'.');
    if(rule==='save'){
      if(left<0) throw new Error('Un debito non si può spostare in un obiettivo ('+x.cat.name+').');
      goalId=ch.goalId||'';
      if(!(s.goals||[]).some(g=>g.id===goalId)) throw new Error('Scegli un obiettivo per '+x.cat.name+'.');
    }
    rows.push({catId:x.cat.id,left:left,rule:rule,goalId:goalId});
  }
  if(!s.deposits) s.deposits=[]; if(!s.closed) s.closed={};
  const createdNext=!s.months[next];
  const mm=monthEnsure(s,key); mm.got=true; const nm=monthEnsure(s,next); const last=clampDate(key,31);
  rows.forEach(r=>{
    if(r.rule==='carry') nm.carry[r.catId]=r.left;
    else if(r.rule==='save') s.deposits.push({id:uidFn('d'),goalId:r.goalId,date:last,amount:r.left,source:'close',closeKey:key,note:'Chiusura '+key});
  });
  /* I soldi "azzerati" e il non assegnato restano fisicamente sui conti: diventano risparmi liberi di quel conto. */
  const accIds=new Set(s.accounts.map(a=>a.id)), ex={};
  rows.forEach(r=>{ if(r.rule==='reset'&&r.left!==0){ const cat=s.categories.find(k=>k.id===r.catId); if(cat&&accIds.has(cat.accountId)) ex[cat.accountId]=(ex[cat.accountId]||0)+r.left; } });
  const ia=(mm.incAcc&&accIds.has(mm.incAcc))?mm.incAcc:s.incomeAcc;
  if(ia&&accIds.has(ia)&&c.unassigned!==0) ex[ia]=(ex[ia]||0)+c.unassigned;
  s.accounts.forEach(a=>{ if(ex[a.id]) a.extra=(a.extra||0)+ex[a.id]; });
  s.closed[key]={at:ts,rows:rows,createdNext:createdNext,extra:ex};
  return rows;
}
function reopenClose(s,key){
  const cl=s.closed&&s.closed[key];
  if(!cl) throw new Error('Questo mese non è chiuso.');
  if(isClosed(s,shiftMonth(key,1))) throw new Error('Riapri prima il mese successivo.');
  const keep=(s.deposits||[]).filter(d=>d.closeKey!==key);
  const bal={}; keep.forEach(d=>{bal[d.goalId]=(bal[d.goalId]||0)+d.amount;});
  for(const id in bal){ if(bal[id]<0) throw new Error('Hai già prelevato da un obiettivo che ha ricevuto soldi da questa chiusura.'); }
  s.deposits=keep;
  const nm=s.months[shiftMonth(key,1)];
  if(nm&&nm.carry) cl.rows.forEach(r=>{ if(r.rule==='carry') delete nm.carry[r.catId]; });
  if(cl.extra) s.accounts.forEach(a=>{ if(cl.extra[a.id]) a.extra=(a.extra||0)-cl.extra[a.id]; });
  delete s.closed[key];
}
/* Saldo di ogni conto calcolato dai movimenti reali:
   saldo iniziale + entrate arrivate - spese pagate con quel conto +/- movimenti tra conti. */
function ledger(s){
  const bal={}; s.accounts.forEach(a=>{bal[a.id]=a.opening||0;});
  for(const k in s.months){
    const m=s.months[k]; if(!m.got||m.pre) continue;
    const id=(m.incAcc&&(m.incAcc in bal))?m.incAcc:s.incomeAcc;
    if(id&&(id in bal)) bal[id]+=(m.salary||0)+(m.extra||0);
  }
  for(const e of s.expenses){ if(!e.internal&&e.accId&&(e.accId in bal)) bal[e.accId]-=e.amount; }
  for(const v of (s.moves||[])){ if(v.from&&(v.from in bal)) bal[v.from]-=v.amount; if(v.to&&(v.to in bal)) bal[v.to]+=v.amount; }
  return bal;
}
/* Per ogni conto: quanto c'è (dai movimenti) e a cosa serve.
   saldo = buste + obiettivi + risparmi liberi + non assegnato + da trasferire - da ricevere + in più (o mancante). */
function accountStatus(s,todayKey){
  const closedNow=isClosed(s,todayKey), key=closedNow?shiftMonth(todayKey,1):todayKey;
  const c=compute(s,key), bal=ledger(s), m=s.months[key], funded=!!(m&&m.got), inc=s.incomeAcc;
  const rows=c.accounts.map(x=>{
    const buste=x.list.reduce((a,l)=>a+(funded?l.budget:0)+l.carry-l.spent,0), extra=x.acc.extra||0, balance=bal[x.acc.id]||0;
    return {acc:x.acc,balance:balance,buste:buste,goals:x.risparmi,extra:extra,unassigned:0,toSend:0,toGet:0,free:balance-buste-x.risparmi-extra};
  });
  const un=funded?c.unassigned:0, ir=rows.find(r=>r.acc.id===inc)||null; let send=0;
  /* Un conto che non copre le sue buste riceve la differenza dal conto dello stipendio. */
  rows.forEach(r=>{ if(r!==ir&&r.free<0){ r.toGet=-r.free; r.free=0; send+=r.toGet; } });
  if(ir){
    ir.unassigned=un; ir.toSend=send; ir.free-=un+send;
    /* Se il conto dello stipendio non ce la fa, i soldi non assegnati degli altri conti tornano indietro. */
    if(ir.free<0){
      let need=-ir.free;
      rows.forEach(r=>{ if(r!==ir&&r.free>0&&need>0){ const v=Math.min(r.free,need); r.toSend=v; r.free-=v; need-=v; ir.toGet+=v; ir.free+=v; } });
    }
  }
  return {key:key,funded:funded,rows:rows,unassigned:un,hasInc:!!ir};
}
/* Trasferimenti da fare, ricavati dallo stato dei conti. */
function transferPlan(s,todayKey){
  const st=accountStatus(s,todayKey), inc=s.incomeAcc, out=[];
  if(!st.hasInc) return out;
  st.rows.forEach(r=>{
    if(r.acc.id===inc) return;
    if(r.toGet>0) out.push({from:inc,to:r.acc.id,amount:r.toGet,kind:'fund'});
    if(r.toSend>0) out.push({from:r.acc.id,to:inc,amount:r.toSend,kind:'back'});
  });
  return out;
}
/* Dalla versione 1 (saldi dedotti dalle buste) alla 2 (saldi dai movimenti):
   il saldo iniziale è scelto in modo che ogni conto parta da quanto l'app si aspettava. */
function migrateV1(s,todayKey){
  const closedNow=isClosed(s,todayKey), key=closedNow?shiftMonth(todayKey,1):todayKey;
  if(!closedNow&&Object.keys(s.months).length) monthEnsure(s,key);
  const c=compute(s,key), inc=s.incomeAcc, has=id=>s.accounts.some(a=>a.id===id);
  const m0=s.months[key], td=(m0&&m0.tdone)||{}, pend={};
  const add=(id,v)=>{pend[id]=(pend[id]||0)+v;};
  if(!closedNow&&inc&&has(inc)) c.accounts.forEach(x=>{ if(x.acc.id!==inc){ const p=x.versare-(td[x.acc.id]||0); add(inc,p); add(x.acc.id,-p); } });
  const prev=s.closed&&s.closed[shiftMonth(key,-1)];
  if(prev) prev.rows.forEach(r=>{
    if(r.rule!=='save'||r.left<=0) return;
    const cat=s.categories.find(k=>k.id===r.catId), g=(s.goals||[]).find(k=>k.id===r.goalId);
    if(cat&&g&&has(cat.accountId)&&has(g.accountId)&&cat.accountId!==g.accountId){ const p=r.left-(td['save:'+r.catId]||0); add(cat.accountId,p); add(g.accountId,-p); }
  });
  const old={};
  c.accounts.forEach(x=>{ old[x.acc.id]=(closedNow?x.carry:x.rimane)+x.risparmi+((!closedNow&&x.acc.id===inc)?c.unassigned:0)+(x.acc.extra||0)+(pend[x.acc.id]||0); });
  for(const k in s.months){ const m=s.months[k]; m.got=k<=todayKey; m.pre=false; m.incAcc=m.got?(inc||''):''; delete m.tdone; }
  const cm={}; s.categories.forEach(k=>{cm[k.id]=k;});
  s.expenses.forEach(e=>{ const k=cm[e.catId]; e.accId=(k&&has(k.accountId))?k.accountId:''; e.internal=false; });
  s.moves=[];
  s.accounts.forEach(a=>{a.opening=0;});
  const flow=ledger(s);
  s.accounts.forEach(a=>{ a.opening=(old[a.id]||0)-(flow[a.id]||0); });
  s.v=2;
}
/* Ricorrenti: una sola volta per mese (registro "done"), giorno 31 -> ultimo giorno del mese. */
function genRecurring(s,today,uidFn,ts){
  const todayKey=today.slice(0,7); let n=0;
  (s.recurring||[]).forEach(r=>{
    const cat=s.categories.find(c=>c.id===r.catId);
    if(r.paused||!cat) return;
    let key=r.start, guard=0;
    while(key<=todayKey&&guard++<60){
      if(r.end&&key>r.end) break;
      if(!(r.done||[]).includes(key)&&!isClosed(s,key)){
        const date=clampDate(key,r.day);
        if(date>today) break;
        monthEnsure(s,key);
        s.expenses.push({id:uidFn('e'),date:date,amount:r.amount,catId:r.catId,note:r.note||'',ts:ts+n,recId:r.id,accId:cat.accountId||'',internal:false,depId:''});
        r.done=(r.done||[]).concat([key]); n++;
      }
      key=shiftMonth(key,1);
    }
  });
  return n;
}
function upcoming(s,today,days){
  const p=today.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]+days);
  const end=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  const k0=today.slice(0,7), out=[];
  (s.recurring||[]).forEach(r=>{
    if(r.paused) return;
    [k0,shiftMonth(k0,1)].forEach(key=>{
      if(key<r.start||(r.end&&key>r.end)||(r.done||[]).includes(key)) return;
      const date=clampDate(key,r.day);
      if(date>today&&date<=end) out.push({rec:r,date:date});
    });
  });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function makeDemo(now){
  const key=monthKeyOf(now);
  const day=n=>key+'-'+pad2(Math.min(n,now.getDate()));
  const accounts=[
    {id:'a_principale',name:'Conto principale',color:'#5b9bd5',icon:'wallet',mono:'CP',opening:0,extra:0,check:null},
    {id:'a_casa',name:'Conto casa',color:'#d98a56',icon:'home',mono:'CC',opening:0,extra:0,check:null},
    {id:'a_risparmio',name:'Risparmio',color:'#62b08a',icon:'shield',mono:'RI',opening:50000,extra:0,check:null}];
  const ids=['c_affitto','c_bollette','c_spesa','c_trasporti','c_svago','c_extra','c_abbonamenti','c_risparmio'];

  if((s.goals||[]).some(g=>!g||!ok(g.id)||!ok(g.name))) return false;
  if((s.deposits||[]).some(d=>!d||!ok(d.id)||!ok(d.goalId)||!Number.isFinite(d.amount))) return false;
  for(const k in (s.closed||{})){ const c=s.closed[k]; if(!/^\d{4}-\d{2}$/.test(k)||!c||!Array.isArray(c.rows)) return false; }
  if(!s.accounts.every(a=>a&&ok(a.id)&&ok(a.name))) return false;
  if(!s.categories.every(c=>c&&ok(c.id)&&ok(c.name))) return false;
  if(!s.expenses.every(e=>e&&ok(e.id)&&ok(e.catId)&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&Number.isFinite(e.amount))) return false;

/* Lo sfondo resta solo su questo dispositivo: e' un'immagine pesante e non ha senso sincronizzarla. */
const BGKEY='bab_bg_v1';
function loadBg(){try{const r=localStorage.getItem(BGKEY);const b=r?JSON.parse(r):null;return (b&&typeof b.img==='string'&&b.img.indexOf('data:image/')===0)?{img:b.img,fade:Math.min(.95,Math.max(.35,+b.fade||.72))}:null;}catch(e){return null;}}
function saveBg(b){
  try{ if(b) localStorage.setItem(BGKEY,JSON.stringify(b)); else localStorage.removeItem(BGKEY); return true; }
  catch(e){ return false; }
}
function applyBg(b){
  const d=document.body;
  if(b&&b.img){ d.style.setProperty('--bgimg','url("'+b.img+'")'); d.style.setProperty('--bgfade',String(b.fade)); d.classList.add('hasbg'); }
  else { d.classList.remove('hasbg'); d.style.removeProperty('--bgimg'); d.style.removeProperty('--bgfade'); }
}
function pickBg(){const f=$('#bgFile');if(f){f.value='';f.click();}}
function bgFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  toast('Preparo l’immagine…');
  const fr=new FileReader();
  fr.onerror=()=>toast('Non riesco a leggere il file');
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Formato immagine non supportato');
    im.onload=()=>{
      const max=1400, sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.width*sc)); cv.height=Math.max(1,Math.round(im.height*sc));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      let q=.78, url=cv.toDataURL('image/jpeg',q);
      while(url.length>1200000&&q>.35){ q-=.1; url=cv.toDataURL('image/jpeg',q); }
      const cur=loadBg(), b={img:url,fade:cur?cur.fade:.72};
      if(!saveBg(b)) return toast('Immagine troppo pesante per questo telefono');
      applyBg(b); render(); toast('Sfondo impostato');
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function bgFade(v){
  const b=loadBg(); if(!b) return;
  b.fade=Math.min(.95,Math.max(.35,(100-(+v||0))/100));
  saveBg(b); applyBg(b);
}
function bgOff(){ saveBg(null); applyBg(null); render(); toast('Sfondo rimosso'); }

/* ---------- account e sincronizzazione fuori dall'artifact (Supabase) ---------- */
const AUTHKEY='bab_auth_v1';
let supaAuth=null, authMsg='';
function supaCfg(){const c=window.BAB_SUPA;return (c&&c.url&&c.key)?c:null;}
function supaOn(){return !!supaCfg()&&!(window.claude&&window.claude.use);}
function authLoad(){try{const r=localStorage.getItem(AUTHKEY);const a=r?JSON.parse(r):null;return (a&&a.uid&&a.access_token)?a:null;}catch(e){return null;}}
function authSave(a){supaAuth=a;try{if(a)localStorage.setItem(AUTHKEY,JSON.stringify(a));else localStorage.removeItem(AUTHKEY);}catch(e){}}
async function supaFetch(path,opt,noRetry){
  const c=supaCfg(); if(!c) throw new Error('Sincronizzazione non configurata');
  opt=opt||{};
  const h={apikey:c.key,'Content-Type':'application/json'};
  for(const k in (opt.headers||{})) h[k]=opt.headers[k];
  if(supaAuth&&supaAuth.access_token&&!opt.anon) h.Authorization='Bearer '+supaAuth.access_token;
  const r=await fetch(c.url+path,{method:opt.method||'GET',headers:h,body:opt.body});
  if(r.status===401&&!opt.anon&&!noRetry&&supaAuth&&supaAuth.refresh_token&&await supaRefresh()) return supaFetch(path,opt,true);
  if(!r.ok){
    let m=''; try{const j=JSON.parse(await r.text());m=j.msg||j.message||j.error_description||j.error||'';}catch(e){}
    const err=new Error(m||('Errore '+r.status)); err.status=r.status; throw err;
  }
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function supaRefresh(){
  try{
    const d=await supaFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',anon:true,body:JSON.stringify({refresh_token:supaAuth.refresh_token})},true);
    if(d&&d.access_token){ authSave({access_token:d.access_token,refresh_token:d.refresh_token||supaAuth.refresh_token,uid:(d.user&&d.user.id)||supaAuth.uid,email:(d.user&&d.user.email)||supaAuth.email}); return true; }
  }catch(e){}
  return false;
}
function supaRef(uid){
  return {set:function(doc){
    return supaFetch('/rest/v1/budget?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify([{user_id:uid,state:doc.state,updated_at:doc.updatedAt}])});
  }};
}
async function initSyncSupa(){
  supaAuth=authLoad();
  if(!supaAuth){ setSync('local'); return; }
  try{
    const rows=await supaFetch('/rest/v1/budget?select=state,updated_at&user_id=eq.'+encodeURIComponent(supaAuth.uid)+'&limit=1');
    const d=(rows&&rows[0])?{state:rows[0].state,updatedAt:+rows[0].updated_at||0}:null;
    remoteRef=supaRef(supaAuth.uid);
    if(d&&d.state&&sane(d.state)&&(S.demo||d.updatedAt>S.updatedAt)){
      S=normalize(JSON.parse(JSON.stringify(d.state))); S.updatedAt=d.updatedAt;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      applySkin(S.skin); runRecurring(true); render();
    }else if(S.updatedAt>0){ dirty=true; flush(); }
    setSync('account');
  }catch(e){ setSync('error'); }
}
function authErr(e){
  const m=((e&&e.message)||'').toLowerCase();
  if(m.indexOf('invalid login')>=0) return 'Email o password non corrette.';
  if(m.indexOf('already registered')>=0||m.indexOf('already been registered')>=0) return 'Questa email ha già un account: usa Accedi.';
  if(m.indexOf('email not confirmed')>=0) return 'Devi prima confermare l’email che ti è arrivata.';
  if(m.indexOf('password')>=0&&m.indexOf('6')>=0) return 'La password deve avere almeno 6 caratteri.';
  if(m.indexOf('failed to fetch')>=0||m.indexOf('networkerror')>=0) return 'Nessuna connessione.';
  return (e&&e.message)||'Non riesco a collegarmi.';
}
function setAuthMsg(t){authMsg=t;const el=$('#auMsg');if(el){el.textContent=t;el.hidden=!t;}}
async function doAuth(mode){
  const e1=$('#auEmail'), e2=$('#auPass'); if(!e1||!e2) return;
  const em=e1.value.trim(), pw=e2.value;
  if(!em||em.indexOf('@')<0) return setAuthMsg('Scrivi un’email valida.');
  if(pw.length<6) return setAuthMsg('La password deve avere almeno 6 caratteri.');
  setAuthMsg(mode==='up'?'Creo l’account…':'Accedo…');
  try{
    const d=await supaFetch(mode==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',anon:true,body:JSON.stringify({email:em,password:pw})});
    if(!d||!d.access_token||!d.user){ setAuthMsg('Account creato. Conferma l’email che ti è arrivata, poi tocca Accedi.'); return; }
    authSave({access_token:d.access_token,refresh_token:d.refresh_token,uid:d.user.id,email:d.user.email});
    setAuthMsg(''); await initSyncSupa(); render(); toast('Collegato: i dati si salvano online');
  }catch(err){ setAuthMsg(authErr(err)); }
}
function authOut(){
  askConfirm('Esci dall’account?','I dati restano su questo telefono, ma smettono di salvarsi online.','Esci',false,function(){
    authSave(null); remoteRef=null; dirty=false; setSync('local'); render(); toast('Uscito');
  });

async function initSync(){
  try{
    if(supaOn()) return initSyncSupa();
    if(!(window.claude&&window.claude.use)) return;
    const r=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    const user=r[0], db=r[1]; if(!user||!db) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/budget');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    remoteRef=ref;
    const d=snap.exists?snap.data():null;
    if(d&&d.state&&sane(d.state)&&(S.demo||(+d.updatedAt||0)>S.updatedAt)){
      S=normalize(JSON.parse(JSON.stringify(d.state))); S.updatedAt=+d.updatedAt||S.updatedAt;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      applySkin(S.skin);
      runRecurring(true);
      render();
    }else if(S.updatedAt>0){ dirty=true; flush(); }
    setSync('account');
  }catch(e){ if(remoteRef) setSync('account'); }
}

function donut(c){

    const len=x.spent/tot*C, gap=segs.length>1?Math.min(2,len*.5):0;

function expListHtml(){

    const qn=q.replace('.',',');
    list=list.filter(e=>{const k=catMap[e.catId];return (e.note||'').toLowerCase().indexOf(q)>=0||(k&&k.name.toLowerCase().indexOf(q)>=0)||fmt(e.amount).indexOf(qn)>=0;});
  }

  const total=list.reduce((a,e)=>a+e.amount,0), filtered=!!(ui.fCat||ui.fAcc||q);

  let h='<div class="sum"><span>'+lab+'</span><span class="num">'+fmt(total)+'</span></div>';

    return h+emptyBox('Nessuna spesa','Non ci sono spese '+(filtered?'con questi filtri':'in '+monthName(ui.month))+'.',

      '<span class="am num'+(inc?' in':'')+'">'+(inc?'+'+fmt(-e.amount):'−'+fmt(e.amount))+'</span></button>';

function goalMonthly(g,miss){
  if(!g.deadline||miss<=0) return '';
  const t=todayStr();
  if(g.deadline<t) return 'Scadenza superata.';
  const n=(+g.deadline.slice(0,4)-+t.slice(0,4))*12+(+g.deadline.slice(5,7)-+t.slice(5,7))+1;
  return 'Servono '+fmt(Math.ceil(miss/n))+' al mese per '+n+(n===1?' mese':' mesi')+'.';
}

/* ---------- trasferimenti, movimenti e verifica conti ---------- */
function verReal(x){
  const raw=ui.ver[x.acc.id];
  if(raw===undefined||String(raw).trim()==='') return null;
  return parseMoney(raw);
}
function verDiffHtml(x,i){
  const raw=ui.ver[x.acc.id];
  if(raw===undefined||String(raw).trim()==='') return '';
  const v=parseMoney(raw);
  if(v===null) return '<p class="err" style="margin-top:8px">Importo non valido.</p>';
  const d=v-x.balance;
  if(d===0) return '<p class="vres ok">'+ic('check',16)+' Coincide.</p><div class="btns" style="margin-top:8px"><button class="btn sec sm" data-a="verOk" data-i="'+i+'">Registra la verifica</button></div>';
  if(d>0) return '<p class="vres warn">Sul conto ci sono '+fmt(d)+' in più del calcolato.</p><p class="note">Di solito è un trasferimento ricevuto, oppure soldi che ti hanno ridato e che devono tornare in una busta.</p>'+
    '<div class="btns" style="margin-top:8px"><button class="btn pri sm" data-a="verMove" data-i="'+i+'">Registra il movimento in entrata</button><button class="btn sec sm" data-a="verIn" data-i="'+i+'">Rimborso in una busta</button><button class="btn sec sm" data-a="verAdj" data-i="'+i+'">Accetta il saldo reale</button></div>';
  return '<p class="vres bad">Sul conto mancano '+fmt(-d)+'.</p><p class="note">Di solito è una spesa non segnata, un prelievo o un trasferimento verso un altro conto.</p>'+
    '<div class="btns" style="margin-top:8px"><button class="btn pri sm" data-a="verExp" data-i="'+i+'">Aggiungi la spesa dimenticata</button><button class="btn sec sm" data-a="verMove" data-i="'+i+'">Registra il movimento in uscita</button><button class="btn sec sm" data-a="verAdj" data-i="'+i+'">Accetta il saldo reale</button></div>';
}
function verGet(i){return statusNow().rows[+i];}
function verInput(t){
  const x=verGet(t.dataset.real); if(!x) return;
  ui.ver[x.acc.id]=t.value;
  const d=$('#vd_'+t.dataset.real); if(d) d.innerHTML=verDiffHtml(x,t.dataset.real);
}
function verOk(i){
  const x=verGet(i); if(!x) return; const v=verReal(x); if(v===null) return;
  x.acc.check={date:todayStr(),real:v}; commit(); toast('Verifica registrata');
}
function verAdj(i){
  const x=verGet(i); if(!x) return; const v=verReal(x); if(v===null) return;
  const d=v-x.balance;
  if(d!==0) S.moves.push({id:uid('m'),date:todayStr(),amount:Math.abs(d),from:d<0?x.acc.id:'',to:d>0?x.acc.id:'',note:'Rettifica dopo la verifica',kind:'adj',ts:Date.now()});
  x.acc.check={date:todayStr(),real:v}; commit(); toast('Saldo allineato');
}
function verMove(i){
  const x=verGet(i); if(!x) return; const v=verReal(x); if(v===null) return;
  const d=v-x.balance; if(d===0) return;
  if(d>0) openMove(null,{to:x.acc.id,from:(S.incomeAcc&&S.incomeAcc!==x.acc.id)?S.incomeAcc:'?',amt:centsToStr(d)});
  else openMove(null,{from:x.acc.id,to:'?',amt:centsToStr(-d)});
}
function verIn(i){
  const x=verGet(i); if(!x) return; const v=verReal(x); if(v===null) return;
  const d=v-x.balance; if(d<=0) return;
  const cat=S.categories.find(c=>c.accountId===x.acc.id);
  openExpense(null,{amt:centsToStr(d),cat:cat?cat.id:null,date:todayStr(),acc:x.acc.id,sign:-1});
}
function verExp(i){
  const x=verGet(i); if(!x) return; const v=verReal(x); if(v===null) return;
  const d=x.balance-v; if(d<=0) return;
  const cat=S.categories.find(c=>c.accountId===x.acc.id);
  openExpense(null,{amt:centsToStr(d),cat:cat?cat.id:null,date:todayStr(),acc:x.acc.id});
}
function verSave(i){
  const x=verGet(i); if(!x||x.free<=0) return;
  x.acc.extra=(x.acc.extra||0)+x.free; commit(); toast('Segnati come risparmio');
}
function markGot(key){
  if(isClosed(S,key)) return;
  const m=ensureMonth(key); m.got=true; m.pre=false; m.incAcc=S.incomeAcc||'';

function openMove(id,preset){
  if(!S.accounts.length){toast('Crea prima un conto');return;}
  const v=id?S.moves.find(x=>x.id===id):null, p=preset||{};
  const from=v?v.from:(p.from!==undefined?p.from:(S.incomeAcc||'?')), to=v?v.to:(p.to!==undefined?p.to:'?');
  form={t:'move',id:v?v.id:null,kind:v?v.kind:'tr',confirm:false};
  const opts=(cur,ext)=>'<option value="?"'+(cur==='?'?' selected':'')+'>Scegli…</option>'+
    S.accounts.map(a=>'<option value="'+esc(a.id)+'"'+(cur===a.id?' selected':'')+'>'+esc(a.name)+'</option>').join('')+
    '<option value=""'+(cur===''?' selected':'')+'>'+ext+'</option>';
  sheet(hdr(v?'Modifica movimento':'Nuovo movimento')+
    '<label class="lbl" for="mAmt">Importo</label><input class="in big" id="mAmt" inputmode="decimal" value="'+esc(v?centsToStr(v.amount):(p.amt||''))+'" placeholder="0,00" autocomplete="off">'+
    '<label class="lbl" for="mFrom">Da</label><select class="in sel" id="mFrom">'+opts(from,'Fuori dai miei conti (entrata)')+'</select>'+
    '<label class="lbl" for="mTo">A</label><select class="in sel" id="mTo">'+opts(to,'Fuori dai miei conti (uscita senza busta)')+'</select>'+
    '<p class="note">Un prelievo è un movimento dal conto a Contanti. I movimenti tra i tuoi conti non toccano le buste.</p>'+
    '<div class="two"><div><label class="lbl" for="mDate">Data</label><input class="in" id="mDate" type="date" value="'+esc(v?v.date:todayStr())+'"></div>'+
    '<div><label class="lbl" for="mNote">Nota</label><input class="in" id="mNote" maxlength="60" value="'+esc(v?v.note:(p.note||''))+'" placeholder="es. Prelievo" autocomplete="off"></div></div>'+
    '<p class="err" id="err" hidden></p><div class="btns"><button class="btn pri" data-a="saveMove">Salva</button>'+(v?'<button class="btn dng" id="delBtn" data-a="delMove">Elimina movimento</button>':'')+'</div>');
}
function saveMove(){
  const amt=parseMoney($('#mAmt').value); if(!amt||amt<=0) return setErr('Inserisci un importo maggiore di zero.');
  const from=$('#mFrom').value, to=$('#mTo').value;
  if(from==='?'||to==='?') return setErr('Scegli il conto di partenza e quello di arrivo.');
  if(from===to) return setErr(from?'Scegli due conti diversi.':'Almeno uno dei due deve essere un tuo conto.');
  const dv=$('#mDate').value, date=/^\d{4}-\d{2}-\d{2}$/.test(dv)?dv:todayStr(), note=$('#mNote').value.trim();
  const kind=form.kind==='adj'?'adj':(from&&to?'tr':(from?'out':'in'));
  if(form.id){ const v=S.moves.find(x=>x.id===form.id); if(v){v.amount=amt;v.from=from;v.to=to;v.date=date;v.note=note;v.kind=kind;} }
  else S.moves.push({id:uid('m'),date:date,amount:amt,from:from,to:to,note:note,kind:kind,ts:Date.now()});
  closeSheet(); commit(); toast('Movimento salvato');
}
function delMove(){
  if(!form.confirm){form.confirm=true;const b=$('#delBtn');if(b)b.textContent='Tocca ancora per eliminare';return;}
  S.moves=S.moves.filter(v=>v.id!==form.id);
  closeSheet(); commit(); toast('Movimento eliminato');
}

function openExpense(id,preset){
  if(!S.categories.length){ toast('Crea prima almeno una busta'); ui.tab='cat'; render(); return; }
  const ex=id?S.expenses.find(e=>e.id===id):null;
  if(ex&&isClosed(S,ex.date.slice(0,7))){toast('Mese chiuso: riaprilo per modificare');return;}
  if(ex&&ex.internal){
    const dep=S.deposits.find(d=>d.id===ex.depId), g=dep?S.goals.find(z=>z.id===dep.goalId):null;
    askConfirm('Annullare il versamento?','I '+fmt(ex.amount)+' tornano nella busta'+(g?' ed escono dall’obiettivo '+g.name:'')+'.','Annulla il versamento',true,function(){
      if(dep&&g){
        if((goalBalances(S)[g.id]||0)<dep.amount){toast('Nell’obiettivo non ci sono più abbastanza soldi');return;}
        S.deposits=S.deposits.filter(d=>d.id!==dep.id);
      }
      S.expenses=S.expenses.filter(e=>e.id!==ex.id); commit(); toast('Versamento annullato');
    });
    return;
  }
  const nowK=todayStr().slice(0,7);
  let defDate=ui.month===nowK?todayStr():(ui.month<nowK?clampDate(ui.month,31):ui.month+'-01');
  if(preset&&preset.date) defDate=preset.date;
  if(!ex&&isClosed(S,defDate.slice(0,7))){toast('Questo mese è chiuso: riaprilo per aggiungere spese');return;}
  let cat=ex?ex.catId:ui.lastCat;
  if(!ex&&preset&&S.categories.some(c=>c.id===preset.cat)) cat=preset.cat;
  if(!S.categories.some(c=>c.id===cat)) cat=S.categories[0].id;
  const catObj=S.categories.find(c=>c.id===cat);
  let acc=ex?(ex.accId||''):((preset&&preset.acc)||(catObj?catObj.accountId:''));
  if(acc&&!S.accounts.some(a=>a.id===acc)) acc='';
  const sign=ex?(ex.amount<0?-1:1):((preset&&preset.sign===-1)?-1:1);
  form={t:'exp',id:ex?ex.id:null,amt:ex?centsToStr(Math.abs(ex.amount)):((preset&&preset.amt)||''),cat:cat,date:ex?ex.date:defDate,note:ex?(ex.note||''):'',acc:acc,accTouched:!!(ex||(preset&&preset.acc)),sign:sign,confirm:false};

function expTitle(){const n=!form.id;return form.sign<0?(n?'Nuovo rimborso':'Modifica rimborso'):(n?'Nuova spesa':'Modifica spesa');}
function amtText(){return (form.sign<0&&form.amt?'+ ':'')+(form.amt||'0')+' €';}
function accLabel(){return form.sign<0?'Accreditato su':'Pagata con';}
function saveLabel(){return form.sign<0?'Salva rimborso':'Salva spesa';}
function expHelp(){return 'Soldi che tornano in una busta: un rimborso, la tua parte di un regalo, un reso. La busta risale e il conto scelto sale dello stesso importo.';}
function expSign(v){
  if(!form||form.t!=='exp') return;
  form.sign=+v<0?-1:1;
  $$('.seg [data-a=expSign]').forEach(b=>b.classList.toggle('on',+b.dataset.v===form.sign));
  const t=$('#exTitle'); if(t) t.textContent=expTitle();
  const o=$('#amtOut'); if(o){o.textContent=amtText();o.classList.toggle('in',form.sign<0);}
  const hp=$('#exHelp'); if(hp) hp.hidden=form.sign>0;

  const qr=$('#exQuickRow'); if(qr){ qr.hidden=form.sign<0; const q=$('#exQuick'); if(q&&form.sign<0) q.checked=false; }
  const bw=$('#exBackWrap'); if(bw) bw.hidden=form.sign<0;

function keyAmt(k){
  if(!form||form.t!=='exp') return;
  let a=form.amt;
  if(k==='del') a=a.slice(0,-1);
  else if(k===','){ if(!a) a='0'; if(a.indexOf(',')<0) a+=','; }
  else{
    if(a==='0') a=k; else a+=k;
    const i=a.indexOf(',');
    if(i>=0&&a.length-i>3) return;
    if(a.replace(',','').length>9) return;
  }
  form.amt=a;
  const o=$('#amtOut'); o.textContent=amtText(); o.classList.toggle('none',!a);
}
function saveExp(){
  const val=parseMoney(form.amt);
  if(!val||val<=0) return setErr('Inserisci un importo maggiore di zero.');
  const cents=val*(form.sign<0?-1:1);
  const k=S.categories.find(c=>c.id===form.cat);
  if(!k) return setErr('Scegli una busta.');
  const date=/^\d{4}-\d{2}-\d{2}$/.test(form.date)?form.date:todayStr();
  const note=(form.note||'').trim();
  if(isClosed(S,date.slice(0,7))) return setErr('Il mese '+monthName(date.slice(0,7))+' è chiuso. Scegli un’altra data o riaprilo.');
  const accId=S.accounts.some(a=>a.id===form.acc)?form.acc:'';
  const q=$('#exQuick'), asQuick=!form.id&&q&&q.checked&&cents>0;
  ensureMonth(date.slice(0,7));
  if(form.id){ const e=S.expenses.find(x=>x.id===form.id); if(e){e.amount=cents;e.catId=form.cat;e.date=date;e.note=note;e.accId=accId;} }
  else S.expenses.push({id:uid('e'),date:date,amount:cents,catId:form.cat,note:note,ts:Date.now(),accId:accId,internal:false,depId:''});
  if(asQuick){
    const label=(note||k.name).slice(0,24);
    if(!S.quick.some(x=>x.label===label&&x.amount===cents&&x.catId===form.cat)) S.quick.push({id:uid('q'),label:label,amount:cents,catId:form.cat});
  }
  const box=$('#exBackBox'), bAmt=$('#exBackAmt');
  if(cents>0&&box&&!box.hidden&&bAmt&&bAmt.value.trim()){
    const back=parseMoney(bAmt.value);
    if(back===null||back<=0) return setErr('L’importo tornato indietro non è valido.');
    if(back>cents) return setErr('Non può esserti tornato più di quanto hai speso.');
    const bs=$('#exBackAcc'), bv=bs?bs.value:'=';
    const bAcc=(bv==='=')?accId:(S.accounts.some(a=>a.id===bv)?bv:'');
    S.expenses.push({id:uid('e'),date:date,amount:-back,catId:form.cat,note:note?'Rimborso '+note:'Rimborso',ts:Date.now()+1,accId:bAcc,internal:false,depId:''});
  }
  ui.lastCat=form.cat;
  const m=date.slice(0,7);
  closeSheet(); commit();
  const what=cents<0?'Rimborso':'Spesa';
  toast(m===ui.month||ui.tab==='ver'?what+' salvat'+(cents<0?'o':'a'):what+' salvat'+(cents<0?'o':'a')+' in '+monthName(m));
}
function delExp(){

function delCat(){
  const id=form.id, exps=S.expenses.filter(e=>e.catId===id), recs=S.recurring.filter(r=>r.catId===id);
  const others=S.categories.filter(c=>c.id!==id);
  if(exps.length||recs.length){
    if(exps.some(e=>isClosed(S,e.date.slice(0,7)))) return setErr('Questa busta ha spese in un mese chiuso. Riapri quel mese prima di eliminarla.');
    if(!others.length) return setErr('Questa busta ha delle spese e non esiste un’altra busta dove spostarle.');
    const box=$('#mvBox');
    if(box.hidden){
      box.hidden=false; $('#delBtn').textContent='Sposta ed elimina';
      return setErr('Questa busta ha '+exps.length+(exps.length===1?' spesa':' spese')+(recs.length?' e '+recs.length+(recs.length===1?' ricorrente':' ricorrenti'):'')+'. Scegli qui sopra dove spostarle, poi tocca “Sposta ed elimina”.');
    }
    const to=$('#mvTo').value;
    if(!others.some(c=>c.id===to)) return setErr('Scegli una busta.');
    exps.forEach(e=>{e.catId=to;}); recs.forEach(r=>{r.catId=to;});
    S.quick.forEach(q=>{if(q.catId===id) q.catId=to;});
  }else if(!form.confirm){form.confirm=true;const b=$('#delBtn');if(b)b.textContent='Tocca ancora per eliminare';return;}
  S.categories=S.categories.filter(c=>c.id!==id);
  S.quick=S.quick.filter(q=>q.catId!==id);
  for(const k in S.months){delete S.months[k].budgets[id]; if(S.months[k].carry) delete S.months[k].carry[id];}
  if(ui.fCat===id) ui.fCat='';
  closeSheet(); commit(); toast('Busta eliminata');
}

/* ---------- backup ---------- */
function backupText(){return JSON.stringify({app:'budget-a-buste',version:2,exportedAt:new Date().toISOString(),state:S},null,1);}
function csvText(){
  const cm={},am={}; S.categories.forEach(x=>{cm[x.id]=x;}); S.accounts.forEach(x=>{am[x.id]=x;});
  const q=v=>{v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"';};
  const rows=[['Data','Importo','Busta','Pagata con','Nota'].join(';')];
  S.expenses.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts-b.ts)).forEach(e=>{
    const k=cm[e.catId], a=e.internal?null:am[e.accId];
    const v=Math.abs(e.amount), sg=e.amount<0?'-':'';
    rows.push([e.date.split('-').reverse().join('/'),sg+Math.floor(v/100)+','+pad2(v%100),q(k?k.name:''),q(a?a.name:''),q(e.note||'')].join(';'));
  });
  return '\ufeff'+rows.join('\r\n');
}
async function deliver(filename,data,title,okMsg){
  let dl=null;
  try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:filename,data:data}); toast(okMsg); return; }
    catch(e){
      if(e&&e.code==='declined') return;
      if(e&&e.code==='rate_limited'){ toast('Riprova tra qualche secondo'); return; }
    }
  }
  if(!(window.claude&&window.claude.use)){
    try{
      const blob=new Blob([data],{type:filename.slice(-4)==='.csv'?'text/csv;charset=utf-8':'application/json'});
      const u=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=u; a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1000);
      toast(okMsg); return;
    }catch(e){}
  }
  try{ await navigator.clipboard.writeText(data); toast(title+': copiato negli appunti'); return; }catch(e){}
  form={t:'backup'};
  sheet(hdr(title)+'<p class="txt">Tieni premuto sul testo, seleziona tutto e copialo in un luogo sicuro (per esempio le Note).</p><textarea class="in" id="bk" readonly>'+esc(data)+'</textarea>');
  const t=$('#bk'); if(t){t.focus();t.select();}
}

function exportCsv(){
  if(!S.expenses.length){toast('Non ci sono spese da esportare');return;}
  return deliver('spese-budget-a-buste.csv',csvText(),'Elenco spese','Elenco spese pronto');
}
function importSheet(){
  form={t:'import'};
  sheet('<div class="sh-h"><h2>Importa backup</h2>'+closeBtn()+'</div><p class="txt">Scegli il file di backup oppure incolla il testo copiato. I dati attuali verranno sostituiti.</p>'+
    '<div class="btns"><button class="btn sec" data-a="pickFile">Scegli un file</button></div>'+
    '<label class="lbl" for="impTxt">Oppure incolla qui</label><textarea class="in" id="impTxt" placeholder="{ ... }"></textarea>'+
    '<p class="err" id="err" hidden></p><div class="btns"><button class="btn pri" data-a="importText">Importa dal testo</button></div>');
}
function tryImport(txt){
  let o; try{o=JSON.parse(txt);}catch(e){return setErr('Il testo non è un backup valido.');}
  const st=(o&&o.state)?o.state:o;
  if(!sane(st)) return setErr('Il backup non ha il formato giusto.');
  const ns=normalize(st);
  askConfirm('Sostituire i dati?','Il backup contiene '+ns.expenses.length+' spese, '+ns.categories.length+' buste e '+ns.accounts.length+' conti. I dati attuali verranno cancellati.','Importa e sostituisci',true,function(){
    S=ns; S.demo=false; S.onboarded=true; ui.ver={}; applySkin(S.skin); commit(); toast('Backup importato');
  });
}
function readFile(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){ if(!form||form.t!=='import') importSheet(); tryImport(String(r.result)); $('#fileIn').value=''; };
  r.onerror=function(){ toast('Non riesco a leggere il file'); };
  r.readAsText(f);
}
function startFresh(){
  const sk=S&&S.skin;
  S=emptyState(); S.skin=sk||'classico'; onb=null; ui.month=monthKeyOf(new Date()); ui.tab='home'; ui.fCat=''; ui.fAcc=''; ui.fText=''; ui.ver={};
  touch();
  render();
}

/* ---------- onboarding ---------- */
function newDraft(){
  return {step:1,sal:'',extra:'',got:true,accs:[{id:uid('a'),name:'Conto principale',bal:'',saved:''}],
    cats:DEFAULT_CATS.map(c=>({id:uid('c'),name:c.name,icon:c.icon,color:c.color,group:c.group,daily:c.daily,bud:'',acc:''}))};
}
function onbLeftCents(){
  const d=onb; const inc=(parseMoney(d.sal)||0)+(parseMoney(d.extra)||0);
  return inc-d.cats.reduce((a,c)=>a+(parseMoney(c.bud)||0),0);
}
function updLeft(){const el=$('#onbLeft');if(!el)return;const v=onbLeftCents();el.textContent=fmt(v);el.classList.toggle('neg',v<0);}
/* Entrate del mese che non risultano piu' sui conti: spese fatte prima di iniziare a usare l'app. */
function onbSpentCents(){
  const d=onb; if(!d||d.got===false) return 0;
  const inc=(parseMoney(d.sal)||0)+(parseMoney(d.extra)||0);
  const have=d.accs.reduce((a,x)=>a+(parseMoney(x.bal)||0)-(parseMoney(x.saved)||0),0);
  return Math.max(0,inc-have);
}
function renderOnb(){
  const d=onb, el=$('#onb'); el.hidden=false;
  const dots=[1,2,3,4].map(i=>'<i class="'+(i<=d.step?'on':'')+'"></i>').join('');
  let b='';
  if(d.step===1){
    b='<h1>Quanto ti entra questo mese?</h1><p class="sub">Inserisci lo stipendio netto di '+monthName(ui.month)+'. Le altre entrate sono facoltative.</p>'+
      '<label class="lbl" for="oSal">Stipendio netto</label><input class="in big" id="oSal" data-onb="sal" inputmode="decimal" placeholder="0,00" value="'+esc(d.sal)+'" autocomplete="off">'+
      '<label class="lbl" for="oExtra">Altre entrate (facoltativo)</label><input class="in" id="oExtra" data-onb="extra" inputmode="decimal" placeholder="0,00" value="'+esc(d.extra)+'" autocomplete="off">'+
      '<label class="chk" for="oGot"><input type="checkbox" id="oGot" data-onb="got"'+(d.got!==false?' checked':'')+'><span>È già arrivato sul conto</span></label>'+
      '<p class="note">Se è già arrivato, è compreso nei saldi che scrivi al prossimo passo. Se non è ancora arrivato, lo segnerai quando arriva.</p>'+
      '<p class="err" id="err" hidden></p><div class="btns"><button class="btn pri" data-a="onbNext">Avanti</button></div>';
  }else if(d.step===2){
    b='<h1>I tuoi conti</h1><p class="sub">Scrivi i conti che usi, anche Contanti, con il saldo che vedi oggi. Metti per primo quello dove arriva lo stipendio. Se una parte del saldo sono risparmi da non toccare, scrivila: non entrerà mai tra i soldi da spendere.</p>'+
      d.accs.map((a,i)=>'<div class="ocard"><div class="r1"><input class="in" data-onb="accname" data-i="'+i+'" maxlength="30" placeholder="Nome del conto" value="'+esc(a.name)+'" aria-label="Nome del conto '+(i+1)+'" autocomplete="off">'+
        (d.accs.length>1?'<button class="x" data-a="onbDelAcc" data-i="'+i+'" aria-label="Rimuovi conto">'+ic('x',18)+'</button>':'')+'</div>'+
        '<div class="r2"><label><small>Saldo di oggi</small><input class="in" data-onb="accbal" data-i="'+i+'" inputmode="decimal" placeholder="0,00" value="'+esc(a.bal||'')+'" autocomplete="off"></label>'+
        '<label><small>Di cui risparmi</small><input class="in" data-onb="accsaved" data-i="'+i+'" inputmode="decimal" placeholder="0,00" value="'+esc(a.saved||'')+'" autocomplete="off"></label></div></div>').join('')+
      '<div class="btns" style="margin-top:12px"><button class="btn sec" data-a="onbAddAcc">+ Aggiungi un conto</button></div>'+
      '<p class="err" id="err" hidden></p><div class="btns"><button class="btn pri" data-a="onbNext">Avanti</button><button class="btn sec" data-a="onbBack">Indietro</button></div>';
  }else if(d.step===3){
    d.cats.forEach(c=>{if(!d.accs.some(a=>a.id===c.acc)) c.acc=d.accs[0].id;});
    b='<h1>Le tue buste</h1><p class="sub">Ogni busta ha un budget mensile e un conto da cui si paga. Cambia i nomi come vuoi.</p>'+
      '<div class="left"><span>Ancora da assegnare</span><b class="num" id="onbLeft"></b></div>'+
      d.cats.map((c,i)=>'<div class="ocard"><div class="r1">'+ib(c.icon,c.color)+'<input class="in" data-onb="catname" data-i="'+i+'" maxlength="30" placeholder="Nome della busta" value="'+esc(c.name)+'" aria-label="Nome della busta '+(i+1)+'" autocomplete="off">'+
        '<button class="x" data-a="onbDelCat" data-i="'+i+'" aria-label="Rimuovi busta">'+ic('x',18)+'</button></div>'+
        '<div class="r2"><input class="in" data-onb="catbud" data-i="'+i+'" inputmode="decimal" placeholder="Budget €" value="'+esc(c.bud)+'" aria-label="Budget mensile" autocomplete="off">'+
        '<select class="in sel" data-onb="cataccount" data-i="'+i+'" aria-label="Conto">'+d.accs.map(a=>'<option value="'+esc(a.id)+'"'+(c.acc===a.id?' selected':'')+'>'+esc(a.name||'Conto')+'</option>').join('')+'</select></div></div>').join('')+
      '<div class="btns" style="margin-top:12px"><button class="btn sec" data-a="onbAddCat">+ Aggiungi una busta</button></div>'+
      '<p class="err" id="err" hidden></p><div class="btns"><button class="btn pri" data-a="onbNext">Avanti</button><button class="btn sec" data-a="onbBack">Indietro</button></div>';
  }else{
    const inc=(parseMoney(d.sal)||0)+(parseMoney(d.extra)||0), left=onbLeftCents(), sp=onbSpentCents();
    b='<h1>Tutto pronto</h1><p class="sub">Potrai cambiare ogni cosa quando vuoi.</p><div style="margin-top:14px">'+
      '<div class="sumrow"><span>Entrate</span><b class="num">'+fmt(inc)+'</b></div>'+
      '<div class="sumrow"><span>Conti</span><b>'+d.accs.length+'</b></div>'+
      '<div class="sumrow"><span>Buste</span><b>'+d.cats.length+'</b></div>'+
      '<div class="sumrow"><span>Saldo dei conti oggi</span><b class="num">'+fmt(d.accs.reduce((s,a)=>s+(parseMoney(a.bal)||0),0))+'</b></div>'+
      '<div class="sumrow"><span>Di cui risparmi da non spendere</span><b class="num">'+fmt(d.accs.reduce((s,a)=>s+(parseMoney(a.saved)||0),0))+'</b></div>'+
      '<div class="sumrow"><span>Ancora da assegnare</span><b class="num'+(left<0?' neg':'')+'">'+fmt(left)+'</b></div>'+
      (sp>0?'<div class="sumrow"><span>Già speso prima di iniziare</span><b class="num">'+fmt(sp)+'</b></div>':'')+'</div>'+
      (sp>0?'<p class="note">Di quello che ti è entrato questo mese, '+fmt(sp)+' non è più sui conti: lo metto in una busta «Già speso prima dell’app», così i conti tornano subito. Puoi cambiarla o eliminarla dopo.</p>':
        '<p class="note">Le spese fatte prima di oggi sono già dentro i saldi che hai scritto: se le aggiungi, in «Pagata con» scegli «Nessun conto».</p>')+
      '<div class="btns"><button class="btn pri" data-a="onbNext">Apri l’app</button><button class="btn sec" data-a="onbBack">Indietro</button></div>';
  }
  el.innerHTML='<div class="onb-in"><div class="steps">'+dots+'<span>'+d.step+' di 4</span></div>'+b+'</div>';
  if(d.step===3) updLeft();
  el.scrollTop=0;
}
function onbInput(t){
  const d=onb; if(!d) return; const k=t.dataset.onb, i=+t.dataset.i;
  if(k==='sal') d.sal=t.value; else if(k==='extra') d.extra=t.value;
  else if(k==='accname') d.accs[i].name=t.value;
  else if(k==='accsaved') d.accs[i].saved=t.value;
  else if(k==='accbal') d.accs[i].bal=t.value;
  else if(k==='got') d.got=t.checked;
  else if(k==='catname') d.cats[i].name=t.value;
  else if(k==='catbud'){d.cats[i].bud=t.value;updLeft();}
  else if(k==='cataccount') d.cats[i].acc=t.value;
}
function onbNext(){
  const d=onb;
  if(d.step===1){
    const s=parseMoney(d.sal), x=parseMoney(d.extra);
    if(s===null||s<=0) return setErr('Inserisci uno stipendio maggiore di zero, per esempio 1.500,00.');
    if(x===null||x<0) return setErr('Le altre entrate non sono valide.');
  }else if(d.step===2){
    if(d.accs.some(a=>!a.name.trim())) return setErr('Dai un nome a ogni conto, oppure rimuovi quelli vuoti.');
    if(d.accs.some(a=>parseMoney(a.bal)===null)) return setErr('Controlla i saldi: c’è un importo non valido.');
    if(d.accs.some(a=>{const v=parseMoney(a.saved);return v===null||v<0;})) return setErr('Controlla i risparmi: c’è un importo non valido.');
    const over=d.accs.find(a=>parseMoney(a.saved)>Math.max(0,parseMoney(a.bal)));
    if(over) return setErr('Su '+over.name.trim()+' i risparmi superano il saldo.');
  }else if(d.step===3){
    if(!d.cats.length) return setErr('Serve almeno una busta.');
    if(d.cats.some(c=>!c.name.trim())) return setErr('Dai un nome a ogni busta, oppure rimuovi quelle vuote.');
    if(d.cats.some(c=>{const v=parseMoney(c.bud);return v===null||v<0;})) return setErr('Controlla i budget: ce n’è uno non valido.');
  }else{ return onbFinish(); }
  d.step++; renderOnb();
}
function onbFinish(){
  const d=onb;
  const accounts=d.accs.map((a,i)=>{const n=a.name.trim(),bk=detectBank(n);return {id:a.id,name:n,color:bk?bk.color:COLORS[i%COLORS.length],icon:bk?bk.icon:(i===0?'wallet':'landmark'),mono:bk&&bk.mono?bk.mono:initials(n),opening:parseMoney(a.bal)||0,extra:parseMoney(a.saved)||0,check:null};});
  const categories=d.cats.map(c=>({id:c.id,name:c.name.trim(),icon:c.icon,color:c.color,accountId:accounts.some(a=>a.id===c.acc)?c.acc:accounts[0].id,group:c.group||guessGroup(c.name),daily:typeof c.daily==='boolean'?c.daily:guessDaily(c.name),closeRule:'reset',closeGoal:''}));
  const budgets={}; d.cats.forEach(c=>{budgets[c.id]=parseMoney(c.bud)||0;});
  /* I saldi scritti sono quelli di oggi. Se lo stipendio è già arrivato è già lì dentro (pre) e non va sommato di nuovo;
     se non è ancora arrivato, entrerà nel saldo quando lo si segna come arrivato. */
  const key=monthKeyOf(new Date()); const months={}; months[key]={salary:parseMoney(d.sal)||0,extra:parseMoney(d.extra)||0,budgets:budgets,carry:{},got:d.got!==false,pre:d.got!==false,incAcc:d.got!==false?accounts[0].id:''};
  /* Quello che e' entrato e non c'e' piu' sui conti e' stato speso prima di iniziare: lo metto in una busta a parte,
     con una spesa senza conto (i saldi scritti lo comprendono gia'), cosi' i conti tornano dal primo giorno. */
  const expenses=[], gap=onbSpentCents();
  if(gap>0){
    const cid=uid('c');
    categories.push({id:cid,name:'Già speso prima dell’app',icon:'alert',color:'#8e9aa4',accountId:accounts[0].id,group:'need',daily:false,closeRule:'reset',closeGoal:''});
    budgets[cid]=gap;
    expenses.push({id:uid('e'),date:todayStr(),amount:gap,catId:cid,note:'Spese di questo mese prima di iniziare',ts:Date.now(),accId:'',internal:false,depId:''});
  }
  S={v:2,demo:false,onboarded:true,updatedAt:0,accounts:accounts,categories:categories,months:months,expenses:expenses,recurring:[],goals:[],deposits:[],closed:{},moves:[],quick:[],incomeAcc:accounts[0].id,skin:(S&&S.skin)||'classico'};
  onb=null; $('#onb').hidden=true; ui.month=key; ui.tab='home'; ui.ver={}; commit(); window.scrollTo(0,0);
}

/* ---------- azioni ---------- */
const A={
  tab:t=>{ui.tab=t.dataset.tab;render();window.scrollTo(0,0);},
  mPrev:()=>{ui.month=shiftMonth(ui.month,-1);render();},
  mNext:()=>{ui.month=shiftMonth(ui.month,1);render();},
  addExp:()=>openExpense(), editExp:t=>openExpense(t.dataset.id),
  goCat:t=>{ui.tab='spese';ui.fCat=t.dataset.id;ui.fAcc='';ui.fText='';render();window.scrollTo(0,0);},
  clearFilters:()=>{ui.fCat='';ui.fAcc='';ui.fText='';render();},
  editIncome:()=>openIncome(),
  newCat:()=>openCat(), editCat:t=>openCat(t.dataset.id), newAcc:()=>openAcc(), editAcc:t=>openAcc(t.dataset.id),
  closeSheet:closeSheet,
  key:t=>keyAmt(t.dataset.k),
  expSign:t=>expSign(t.dataset.v), verIn:t=>verIn(t.dataset.i),
  pickBg:()=>pickBg(), bgOff:()=>bgOff(),
  authIn:()=>doAuth('in'), authUp:()=>doAuth('up'), authOut:()=>authOut(),
  exBack:()=>{const b=$('#exBackBox'),l=$('#exBackLnk');if(!b)return;b.hidden=!b.hidden;if(l)l.textContent=b.hidden?'+ Una parte ti è già tornata indietro':'− Nessun rimborso, annulla';if(!b.hidden){const a=$('#exBackAmt');if(a)a.focus();}},
  pickCat:t=>{if(!form)return;form.cat=t.dataset.id;$$('.catpick').forEach(b=>b.classList.toggle('on',b.dataset.id===form.cat));
    if(!form.accTouched){const sel=$('#exAcc');form.acc=catAcc(form.cat);if(sel)sel.value=form.acc;}},
  pickIcon:t=>{if(!form)return;form.touched=true;form.icon=t.dataset.v;$$('.pk').forEach(b=>b.classList.toggle('on',b.dataset.v===form.icon));},
  pickColor:t=>{if(!form)return;form.touched=true;form.color=t.dataset.v;$$('.swb').forEach(b=>b.classList.toggle('on',b.dataset.v===form.color));},
  saveExp:()=>saveExp(), delExp:()=>delExp(), saveInc:()=>saveInc(),
  saveCat:()=>saveCat(), delCat:()=>delCat(), saveAcc:()=>saveAcc(), delAcc:()=>delAcc(),
  confirmYes:()=>{const f=confirmFn;closeSheet();if(f)f();},
  resetDemo:()=>askConfirm('Cancellare i dati di esempio?','Spariscono conti, buste e spese di prova. Poi inserisci i tuoi dati veri in 4 passi.','Cancella e inizia',true,()=>startFresh()),
  wipe:()=>askConfirm('Cancellare tutto?','Conti, buste e spese verranno eliminati da questo dispositivo e dal salvataggio online. Non si può annullare.','Cancella tutto',true,()=>startFresh()),
  exportData:()=>exportData(), importSheet:()=>importSheet(),
  pickFile:()=>$('#fileIn').click(),
  importText:()=>{const t=$('#impTxt');tryImport(t?t.value:'');},
  splitMode:t=>{ui.split=t.dataset.v;render();},
  closeMonth:()=>openClose(), doClose:()=>doClose(),
  reopen:()=>askConfirm('Riaprire il mese?','Il riporto e i versamenti automatici creati dalla chiusura vengono annullati. Le spese che hai inserito tu restano.','Riapri il mese',false,function(){try{reopenClose(S,ui.month);commit();toast('Mese riaperto');}catch(e){toast(e.message);}}),
  newRec:()=>openRec(), editRec:t=>openRec(t.dataset.id), saveRec:()=>saveRec(), delRec:()=>delRec(), pauseRec:()=>pauseRec(),
  newGoal:()=>openGoal(), editGoal:t=>openGoal(t.dataset.id), saveGoal:()=>saveGoal(), delGoal:()=>delGoal(),
  goalIn:t=>openDeposit(t.dataset.id,'in'), goalOut:t=>openDeposit(t.dataset.id,'out'), saveDep:()=>saveDep(),
  editBudgets:()=>openBudgets(), saveBudgets:()=>saveBudgets(), catUp:()=>moveCat(-1), catDown:()=>moveCat(1),
  applyBank:()=>applyBank(),
  toastAct:()=>{const f=toastFn;toastFn=null;$('#toast').hidden=true;if(f)f();},
  quickAdd:t=>quickAdd(t.dataset.id), quickList:()=>openQuickList(), newQuick:()=>openQuick(), editQuick:t=>openQuick(t.dataset.id), saveQuick:()=>saveQuick(), delQuick:()=>delQuick(),
  newMove:()=>openMove(), editMove:t=>openMove(t.dataset.id), saveMove:()=>saveMove(), delMove:()=>delMove(),
  trReg:t=>{const l=transferPlan(S,todayStr().slice(0,7))[+t.dataset.i];if(l)openMove(null,{from:l.from,to:l.to,amt:centsToStr(l.amount),note:'Trasferimento'});},
  verOk:t=>verOk(t.dataset.i), verAdj:t=>verAdj(t.dataset.i), verMove:t=>verMove(t.dataset.i), verExp:t=>verExp(t.dataset.i), verSave:t=>verSave(t.dataset.i),
  incGot:()=>markGot(ui.month), incGotNow:()=>markGot(todayStr().slice(0,7)),
  setSkin:t=>{S.skin=t.dataset.v;applySkin(S.skin);commit();},
  exportCsv:()=>exportCsv(),
  onbNext:onbNext,
  onbBack:()=>{if(onb&&onb.step>1){onb.step--;renderOnb();}},
  onbAddAcc:()=>{onb.accs.push({id:uid('a'),name:''});renderOnb();},
  onbDelAcc:t=>{onb.accs.splice(+t.dataset.i,1);renderOnb();},
  onbAddCat:()=>{onb.cats.push({id:uid('c'),name:'',icon:'star',color:COLORS[onb.cats.length%COLORS.length],bud:'',acc:''});renderOnb();},
  onbDelCat:t=>{onb.cats.splice(+t.dataset.i,1);renderOnb();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t){const f=A[t.dataset.a];if(f)f(t,e);return;}
  if(e.target.id==='ov') closeSheet();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='exDate'&&form) form.date=t.value;
  else if(t.id==='exNote'&&form) form.note=t.value;
  else if(t.dataset&&t.dataset.bud) updBudLeft();
  else if(t.id==='fText'){ui.fText=t.value;const l=$('#expList');if(l)l.innerHTML=expListHtml();}
  else if(t.dataset&&t.dataset.real!==undefined) verInput(t);
  else if(t.id==='aName'&&form&&form.t==='acc') accNameInput(t.value);
  else if(t.dataset&&t.dataset.onb) onbInput(t);
  else if(t.dataset&&t.dataset.bg==='fade') bgFade(t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bgFile'){bgFile(t);return;}
  if(t.id==='incAcc'){S.incomeAcc=t.value;commit();}
  else if(t.id==='exAcc'&&form&&form.t==='exp'){form.acc=t.value;form.accTouched=true;}
  else if(t.id==='fCat'){ui.fCat=t.value;render();}
  else if(t.id==='fAcc'){ui.fAcc=t.value;render();}
  else if(t.dataset&&t.dataset.onb) onbInput(t);
  else if(t.id==='fileIn') readFile(t.files&&t.files[0]);
  else if(t.dataset&&t.dataset.close&&form&&form.t==='close'){form.ch[t.dataset.close].rule=t.value;const g=$('[data-closegoal="'+CSS.escape(t.dataset.close)+'"]');if(g)g.hidden=t.value!=='save';}
  else if(t.dataset&&t.dataset.closegoal&&form&&form.t==='close'){form.ch[t.dataset.closegoal].goalId=t.value;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden) closeSheet();});

/* ---------- avvio ---------- */
$('#tabs').innerHTML=TABS.map(t=>'<button class="tab" data-a="tab" data-tab="'+t[0]+'">'+ic(t[2],22)+'<span>'+t[1]+'</span></button>').join('');
$('#fab').innerHTML=ic('plus',20,2.2)+'<span>Spesa</span>';
S=loadLocal()||makeDemo(new Date());
applySkin(S.skin);
applyBg(loadBg());
runRecurring(true);
render();
initSync();
})();
